# Firebase App Hosting Configuration - BASE
# https://firebase.google.com/docs/app-hosting/configure
#
# This file contains shared configuration used by both test and production environments.
# Environment-specific values are defined in:
# - apphosting.test.yaml (for test environment)
# - apphosting.prod.yaml (for production environment)
#
# Make sure to set the "Environment name" in Firebase Console:
# - Test backend: Set to "test"
# - Production backend: Set to "prod"

# Cloud Run configuration
runConfig:
  minInstances: 0  # Scale to zero for cost savings
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables and secrets
env:
  # ==========================================
  # Stripe Configuration (from Secret Manager)
  # ==========================================
  # Stripe Secret Key (from Secret Manager)
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  # Stripe Webhook Secret (from Secret Manager)
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # ==========================================
  # Stripe Price IDs (from Secret Manager)
  # ==========================================
  - variable: STRIPE_PRICE_ID_STARTER_MONTHLY
    secret: STRIPE_PRICE_ID_STARTER_MONTHLY
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_PROFESSIONAL_MONTHLY
    secret: STRIPE_PRICE_ID_PROFESSIONAL_MONTHLY
    availability:
      - RUNTIME

  - variable: STRIPE_PRICE_ID_BUSINESS_MONTHLY
    secret: STRIPE_PRICE_ID_BUSINESS_MONTHLY
    availability:
      - RUNTIME

  # Legacy Pro tier (for backward compatibility)
  - variable: STRIPE_PRICE_ID_PRO_MONTHLY
    secret: STRIPE_PRICE_ID_PROFESSIONAL_MONTHLY
    availability:
      - RUNTIME
